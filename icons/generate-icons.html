<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
</head>
<body>
  <h1>Icon Generator</h1>
  <p>Right-click each canvas and "Save image as..." to save the icons.</p>

  <h3>icon16.png</h3>
  <canvas id="icon16" width="16" height="16"></canvas>

  <h3>icon48.png</h3>
  <canvas id="icon48" width="48" height="48"></canvas>

  <h3>icon128.png</h3>
  <canvas id="icon128" width="128" height="128"></canvas>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Background - dark gray gradient
      const gradient = ctx.createLinearGradient(0, 0, 0, size);
      gradient.addColorStop(0, '#4a4a4a');
      gradient.addColorStop(1, '#1a1a1a');

      // Draw rounded rectangle background
      const radius = size * 0.15;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fillStyle = gradient;
      ctx.fill();

      // Draw scroll indicator (vertical line with arrows)
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = size * 0.08;
      ctx.lineCap = 'round';

      const centerX = size * 0.5;
      const topY = size * 0.25;
      const bottomY = size * 0.75;

      // Vertical line
      ctx.beginPath();
      ctx.moveTo(centerX, topY);
      ctx.lineTo(centerX, bottomY);
      ctx.stroke();

      // Down arrow
      const arrowSize = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(centerX - arrowSize, bottomY - arrowSize);
      ctx.lineTo(centerX, bottomY);
      ctx.lineTo(centerX + arrowSize, bottomY - arrowSize);
      ctx.stroke();

      // Dimming effect (gradient overlay on bottom half)
      const dimGradient = ctx.createLinearGradient(0, size * 0.4, 0, size);
      dimGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
      dimGradient.addColorStop(1, 'rgba(0, 0, 0, 0.6)');

      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fillStyle = dimGradient;
      ctx.fill();
    }

    drawIcon('icon16', 16);
    drawIcon('icon48', 48);
    drawIcon('icon128', 128);
  </script>
</body>
</html>
